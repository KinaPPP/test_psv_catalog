var matchedDlcs = [];
var itemsPerPage = 50;

function getQueryParam(name) {
    var query = window.location.search.substring(1);
    var vars = query.split("&");
    for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split("=");
        if (pair[0] === name) return pair[1];
    }
    return null;
}

// 履歴を残さずに画面の内容だけを切り替えるページネーション
function renderPage(page) {
    var grid = document.getElementById('dlcGrid');
    var paginationTop = document.getElementById('paginationTop');
    var paginationBottom = document.getElementById('paginationBottom');
    
    var totalPages = Math.ceil(matchedDlcs.length / itemsPerPage);
    if (page < 1) page = 1;
    if (page > totalPages) page = totalPages;

    var startIdx = (page - 1) * itemsPerPage;
    var endIdx = Math.min(startIdx + itemsPerPage, matchedDlcs.length);

    var html = '';
    for (var j = startIdx; j < endIdx; j++) {
        var dlc = matchedDlcs[j];
        html += '<div class="card" style="width: 140px; height: auto;">';
        html += '<p style="font-size: 11px; height: 4em; overflow: hidden;"><b>' + dlc.title + '</b></p>';
        html += '<a href="psns:browse?product=' + dlc.id + '" class="btn">ストアを開く</a>';
        html += '</div>';
    }
    grid.innerHTML = html;

    var pageHtml = '<div class="pagination">';
    if (page > 1) {
        pageHtml += '<a href="#" onclick="renderPage(' + (page - 1) + '); return false;">&laquo; 前へ</a>';
    }
    pageHtml += '<span> ページ ' + page + ' / ' + totalPages + ' </span>';
    if (page < totalPages) {
        pageHtml += '<a href="#" onclick="renderPage(' + (page + 1) + '); return false;">次へ &raquo;</a>';
    }
    pageHtml += '</div>';

    paginationTop.innerHTML = pageHtml;
    paginationBottom.innerHTML = pageHtml;
    
    window.scrollTo(0, 0);
}

    var targetId = getQueryParam("id");

    if (!targetId) {
        document.getElementById('dlcGrid').innerHTML = '<p>ゲームIDが指定されていません。</p>';
        return;
    }
    
    // 対象のDLCを抽出
    for (var i = 0; i < allDlcs.length; i++) {
        if (allDlcs[i].title_id === targetId) {

        }
    }
    
    header.innerHTML = '<a href="javascript:history.back()">&laquo; 戻る</a> ' + targetId + ' のDLC (' + matchedDlcs.length + '件)';
    
    if (matchedDlcs.length === 0) {
        document.getElementById('dlcGrid').innerHTML = '<p>このゲームのDLCは見つかりませんでした。</p>';
        return;
    }

    // 初回描画
    renderPage(1);
};
</script>

</body>
</html>
