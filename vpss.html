<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Store Searcher (PS Vita / Legacy Browser Edition)</title>
<style>
  body {
    background-color: #121418;
    color: #e6e8ec;
    font-family: sans-serif;
    margin: 0;
    padding: 8px;
    font-size: 14px;
    line-height: 1.4;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 8px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid #2d333f;
    color: #4da3ff;
  }
  .box {
    background-color: #1c2026;
    border: 1px solid #2d333f;
    padding: 8px;
    margin-bottom: 8px;
  }
  .row {
    margin-bottom: 6px;
  }
  .row:last-child {
    margin-bottom: 0;
  }
  label {
    display: inline-block;
    margin-right: 6px;
    font-weight: bold;
    font-size: 12px;
    color: #a0a8b8;
  }
  input[type="text"], select {
    background-color: #0e1013;
    color: #ffffff;
    border: 1px solid #444c5c;
    padding: 5px 6px;
    font-size: 14px;
  }
  input[type="text"] {
    width: 62%;
  }
  select {
    padding: 4px;
    font-size: 13px;
  }
  button {
    background-color: #0070d1;
    color: #ffffff;
    border: none;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  button:active {
    background-color: #005bb5;
  }
  button.secondary {
    background-color: #333a48;
  }
  .status {
    font-size: 12px;
    color: #8ab4f8;
    margin-bottom: 8px;
  }
  .item {
    background-color: #1c2026;
    border: 1px solid #2d333f;
    padding: 8px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .item-thumb {
    float: left;
    width: 84px;
    height: 84px;
    background-color: #0e1013;
    margin-right: 10px;
    border: 1px solid #333;
  }
  .item-body {
    overflow: hidden;
  }
  .item-title {
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 4px;
  }
  .item-meta {
    font-size: 11px;
    color: #a0a8b8;
    margin-bottom: 4px;
  }
  .item-price {
    font-size: 13px;
    font-weight: bold;
    color: #7ee787;
    margin-bottom: 6px;
  }
  .item-actions a, .item-actions button {
    display: inline-block;
    font-size: 12px;
    padding: 4px 8px;
    margin-right: 6px;
    margin-bottom: 4px;
    text-decoration: none;
    color: #ffffff;
  }
  .btn-store {
    background-color: #2ea043;
  }
  .btn-detail {
    background-color: #3b4354;
  }
  .clear {
    clear: both;
  }
  .pager {
    text-align: center;
    padding: 8px 0;
  }
  .notice {
    font-size: 11px;
    color: #9aa3b2;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h1>PS Store Searcher (PS Vita対応軽量版)</h1>

<div class="box">
  <div class="row">
    <input type="text" id="q" placeholder="タイトル名を入力 (例: 軌跡, ロックマン)" />
    <button type="button" id="btnSearch">検索</button>
  </div>
  <div class="row">
    <label for="region">地域:</label>
    <select id="region">
      <option value="jp/ja" selected>JP / 日本語 (jp/ja)</option>
      <option value="us/en">US / English (us/en)</option>
      <option value="gb/en">UK / English (gb/en)</option>
      <option value="hk/ja">HK / 日本語 (hk/ja)</option>
      <option value="hk/en">HK / English (hk/en)</option>
    </select>

    <label for="platform" style="margin-left:8px;">機種:</label>
    <select id="platform">
      <option value="vita" selected>PS Vita</option>
      <option value="ps3">PS3</option>
      <option value="psp">PSP</option>
      <option value="ps4">PS4</option>
      <option value="all">すべて</option>
    </select>
  </div>
  <div class="notice">
    ※PS Vita / PS3 / PSPコンテンツの検索用軽量フロントエンドです。JSONP / Chihiro API を使用し、旧ブラウザ(ES5)で動作します。
  </div>
</div>

<div id="status" class="status">検索ワードを入力して「検索」を押してください。</div>
<div id="results"></div>
<div id="pager" class="pager"></div>

<script type="text/javascript">
(function() {
  var CLIENT_ID = "2eb25762-877f-4140-b341-7c7e14c19f98";
  var PAGE_SIZE = 20;
  var currentStart = 0;
  var lastQuery = "";

  // URLパラメータから clientid / 検索語 を取得 (ES5互換)
  function getQueryParam(name) {
    var search = window.location.search;
    if (!search || search.length < 2) return null;
    var pairs = search.substring(1).split("&");
    for (var i = 0; i < pairs.length; i++) {
      var idx = pairs[i].indexOf("=");
      if (idx === -1) {
        if (pairs[i] === name) return "";
      } else {
        var key = decodeURIComponent(pairs[i].substring(0, idx));
        if (key === name) {
          return decodeURIComponent(pairs[i].substring(idx + 1).replace(/\+/g, " "));
        }
      }
    }
    return null;
  }

  var paramCid = getQueryParam("clientid");
  if (paramCid) {
    CLIENT_ID = paramCid;
  }

  var qInput = document.getElementById("q");
  var regionSelect = document.getElementById("region");
  var platformSelect = document.getElementById("platform");
  var btnSearch = document.getElementById("btnSearch");
  var statusEl = document.getElementById("status");
  var resultsEl = document.getElementById("results");
  var pagerEl = document.getElementById("pager");

  function setStatus(msg) {
    statusEl.innerHTML = escapeHtml(msg);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function encodeQueryWord(word) {
    return encodeURIComponent(word.replace(/\s+/g, " ").replace(/^\s+|\s+$/g, ""));
  }

  // Sony Chihiro API 検索リクエスト (XHR + JSONP フォールバック)
  function searchStore(start) {
    var rawQ = qInput.value;
    if (!rawQ || rawQ.replace(/\s+/g, "") === "") {
      setStatus("検索キーワードを入力してください。");
      return;
    }

    currentStart = start || 0;
    lastQuery = rawQ;

    var region = regionSelect.value; // e.g. "jp/ja"
    var platform = platformSelect.value;
    var encodedQ = encodeQueryWord(rawQ);

    var url = "https://store.playstation.com/store/api/chihiro/00_09_000/tumbler/" +
              region + "/999/" + encodedQ +
              "?suggested_size=" + PAGE_SIZE +
              "&mode=game&start=" + currentStart;

    if (platform !== "all") {
      url += "&platform=" + encodeURIComponent(platform);
    }

    setStatus("検索中... (" + rawQ + ")");
    resultsEl.innerHTML = "";
    pagerEl.innerHTML = "";

    // まず標準XHRで試行し、CORS制限時はJSONPへフォールバック
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            renderResults(data);
          } catch (e) {
            fetchJsonp(url);
          }
        } else {
          fetchJsonp(url);
        }
      }
    };
    xhr.onerror = function() {
      fetchJsonp(url);
    };
    try {
      xhr.send();
    } catch (e) {
      fetchJsonp(url);
    }
  }

  function fetchJsonp(baseUrl) {
    var cbName = "ps_cb_" + (new Date().getTime()) + "_" + Math.floor(Math.random() * 10000);
    var script = document.createElement("script");
    var timer = setTimeout(function() {
      cleanup();
      setStatus("通信エラーまたはタイムアウトです。VitaブラウザのSSL/TLS制限、またはネットワーク環境をご確認ください。");
    }, 10000);

    function cleanup() {
      clearTimeout(timer);
      if (script.parentNode) script.parentNode.removeChild(script);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
    }

    window[cbName] = function(data) {
      cleanup();
      renderResults(data);
    };

    script.src = baseUrl + "&callback=" + cbName;
    script.onerror = function() {
      cleanup();
      setStatus("APIへの接続に失敗しました。(CORS / TLS1.2非対応の可能性)");
    };
    document.body.appendChild(script);
  }

  function getThumbnail(links) {
    if (!links || !links.length) return "";
    for (var i = 0; i < links.length; i++) {
      if (links[i].url) return links[i].url;
    }
    return "";
  }

  function getPriceText(item) {
    if (item.default_sku && item.default_sku.display_price) {
      return item.default_sku.display_price;
    }
    if (item.skus && item.skus.length > 0 && item.skus[0].display_price) {
      return item.skus[0].display_price;
    }
    return "価格情報なし / 配信終了";
  }

  function getSkuId(item) {
    if (item.default_sku && item.default_sku.id) {
      return item.default_sku.id;
    }
    if (item.skus && item.skus.length > 0 && item.skus[0].id) {
      return item.skus[0].id;
    }
    return "";
  }

  function renderResults(data) {
    if (!data || !data.links || data.links.length === 0) {
      setStatus("「" + lastQuery + "」に一致するコンテンツは見つかりませんでした。");
      return;
    }

    var total = data.total_results || data.links.length;
    setStatus("「" + lastQuery + "」の検索結果: " + (currentStart + 1) + "〜" + (currentStart + data.links.length) + "件 (全" + total + "件)");

    var regionParts = regionSelect.value.split("/");
    var locale = regionParts[1] + "-" + regionParts[0]; // e.g. ja-jp
    var html = [];

    for (var i = 0; i < data.links.length; i++) {
      var item = data.links[i];
      var name = item.name || "(名称不明)";
      var id = item.id || "";
      var skuId = getSkuId(item);
      var platforms = item.playable_platform ? item.playable_platform.join(", ") : "";
      var provider = item.provider_name || "";
      var price = getPriceText(item);
      var thumb = getThumbnail(item.images);
      var contentType = item.game_contentType || item.top_category || "";

      var storeUrl = "https://store.playstation.com/" + locale + "/product/" + encodeURIComponent(id);
      var containerApiUrl = "https://store.playstation.com/store/api/chihiro/00_09_000/container/" +
                            regionSelect.value + "/999/" + encodeURIComponent(id);

      html.push('<div class="item">');
      if (thumb) {
        html.push('<img class="item-thumb" src="' + escapeHtml(thumb) + '?w=128&h=128" alt="" />');
      }
      html.push('<div class="item-body">');
      html.push('<div class="item-title">' + escapeHtml(name) + '</div>');
      html.push('<div class="item-meta">');
      if (platforms) html.push('[' + escapeHtml(platforms) + '] ');
      if (contentType) html.push(escapeHtml(contentType) + ' / ');
      if (provider) html.push(escapeHtml(provider) + ' / ');
      html.push('ID: ' + escapeHtml(id));
      html.push('</div>');
      html.push('<div class="item-price">' + escapeHtml(price) + '</div>');
      html.push('<div class="item-actions">');
      html.push('<a class="btn-store" href="' + escapeHtml(storeUrl) + '" target="_blank">PS Storeページ</a>');
      html.push('<a class="btn-detail" href="' + escapeHtml(containerApiUrl) + '" target="_blank">JSON詳細</a>');
      if (skuId) {
        html.push('<button type="button" class="secondary" onclick="window._addToBasket('' + escapeHtml(skuId) + '', '' + escapeHtml(locale) + '')">カートに追加(API)</button>');
      }
      html.push('</div>');
      html.push('</div>');
      html.push('<div class="clear"></div>');
      html.push('</div>');
    }

    resultsEl.innerHTML = html.join("");

    // ページネーション
    var pagerHtml = [];
    if (currentStart > 0) {
      var prevStart = Math.max(0, currentStart - PAGE_SIZE);
      pagerHtml.push('<button type="button" class="secondary" onclick="window._goPage(' + prevStart + ')">&laquo; 前の' + PAGE_SIZE + '件</button> ');
    }
    if (currentStart + data.links.length < total) {
      var nextStart = currentStart + PAGE_SIZE;
      pagerHtml.push('<button type="button" onclick="window._goPage(' + nextStart + ')">次の' + PAGE_SIZE + '件 &raquo;</button>');
    }
    pagerEl.innerHTML = pagerHtml.join("");
  }

  // カート追加処理 (PSN GraphQL / Web Commerce API)
  window._addToBasket = function(skuId, locale) {
    if (!skuId) return;
    setStatus("カートに追加中: " + skuId + " ...");

    var endpoint = "https://web.np.playstation.com/api/graphql/v1/op";
    var payload = JSON.stringify({
      operationName: "addToCart",
      variables: {
        skus: [{ skuId: skuId }]
      },
      extensions: {
        persistedQuery: {
          version: 1,
          sha256Hash: "93eb198753e06cba3a30ed3a6cd3abc1f1214c11031ffc5b0a5ca6d08c77061f"
        }
      }
    });

    var xhr = new XMLHttpRequest();
    xhr.open("POST", endpoint, true);
    xhr.withCredentials = true;
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("x-psn-store-locale-override", locale);

    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status >= 200 && xhr.status < 300) {
          setStatus("カート追加リクエスト完了！PS Storeのカート画面を更新して確認してください。");
        } else {
          setStatus("カート追加エラー (HTTP " + xhr.status + ")。PS Storeにログイン済みの状態か確認してください。");
        }
      }
    };
    xhr.onerror = function() {
      setStatus("カートAPIへの接続に失敗しました（CORSまたはログインセッション未保持）。");
    };
    xhr.send(payload);
  };

  window._goPage = function(start) {
    searchStore(start);
    window.scrollTo(0, 0);
  };

  btnSearch.onclick = function() {
    searchStore(0);
  };

  qInput.onkeydown = function(e) {
    e = e || window.event;
    if (e.keyCode === 13) {
      searchStore(0);
    }
  };
})();
</script>
</body>
</html>
